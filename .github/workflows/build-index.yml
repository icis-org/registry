name: Build Index

on:
  push:
    branches: [main]
    paths:
      - 'packages/*.ici'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate registry.json
        run: |
          python3 -c "
          import json, os, glob

          packages = []
          for f in sorted(glob.glob('packages/*.ici')):
              data = {}
              with open(f) as fh:
                  for line in fh:
                      line = line.strip()
                      if not line or line.startswith('#') or line.startswith('//'):
                          continue
                      if ':' not in line:
                          continue
                      key, _, val = line.partition(':')
                      data[key.strip().lower()] = val.strip()

              if 'name' not in data or 'url' not in data:
                  continue

              packages.append({
                  'name': data.get('name', ''),
                  'version': data.get('version', ''),
                  'desc': data.get('desc', ''),
                  'ici': f'https://raw.githubusercontent.com/{os.environ[\"GITHUB_REPOSITORY\"]}/main/{f}',
                  'homepage': data.get('homepage', '')
              })

          index = {
              'name': 'ICIS Community Registry',
              'packages': packages
          }

          with open('registry.json', 'w') as out:
              json.dump(index, out, indent=2)

          print(f'Indexed {len(packages)} packages')
          "

      - name: Commit registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --cached --quiet || git commit -m "Update registry.json [skip ci]" && git push
